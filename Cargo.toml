[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/hook"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ALArvi019/ALarviTerm"
rust-version = "1.85"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
# Se quita la información de depuración pero no los nombres de función: hacen
# falta para que la pila de un fallo se pueda leer.
strip = "debuginfo"
panic = "abort"
